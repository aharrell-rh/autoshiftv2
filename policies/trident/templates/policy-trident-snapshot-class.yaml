apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-trident-snapshot-class
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CA Security Assessment and Authorization
    policy.open-cluster-management.io/controls: CA-2 Security Assessments, CA-7 Continuous Monitoring
spec:
  dependencies:
  - name: policy-trident-orchestrator
    namespace: {{ .Values.policy_namespace }}
    apiVersion: policy.open-cluster-management.io/v1
    compliance: Compliant
    kind: Policy
  - name: policy-trident-machineconfigs
    namespace: {{ .Values.policy_namespace }}
    apiVersion: policy.open-cluster-management.io/v1
    compliance: Compliant
    kind: Policy
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: trident-snapshot-class
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: snapshot.storage.k8s.io/v1
                kind: VolumeSnapshotClass
                metadata:
                  name: trident-csi-snapclass
                  annotations:
                    snapshot.storage.kubernetes.io/is-default-class: "true"
                driver: csi.trident.netapp.io
                deletionPolicy: Delete
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-trident-snapshot-class
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/trident'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-trident-snapshot-class
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-trident-snapshot-class
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-trident-snapshot-class
    apiGroup: policy.open-cluster-management.io
    kind: Policy
